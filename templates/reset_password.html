<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#102f27">
    <title>Reset password · TzufGuard</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    <script type="module" src="{{ url_for('static', filename='reset-password.js') }}"></script>
</head>
<body class="reset-page">
    {% include "_icons.html" %}
    <header class="simple-header page-width"><a class="brand" href="/" aria-label="TzufGuard home"><svg><use href="#icon-logo"/></svg><span>TzufGuard</span></a></header>
    <main class="reset-main">
        <form id="reset-form" class="reset-card">
            <div class="success-mark"><svg><use href="#icon-key"/></svg></div>
            <p class="eyebrow">Account recovery</p>
            <h1>Choose a new password</h1>
            <p id="reset-intro">Use at least eight characters. Your other account details will stay unchanged.</p>
            <label>New password<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
            <p id="reset-error" class="form-error" role="alert"></p>
            <button class="button button--forest button--full" type="submit">Save new password</button>
        </form>
    </main>
</body>
</html>
