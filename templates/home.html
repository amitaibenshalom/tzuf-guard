<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Monitor door states and review their activity history with TzufGuard.">
    <meta name="theme-color" content="#102f27">
    <meta property="og:title" content="TzufGuard · Know when a door changes">
    <meta property="og:description" content="Monitor door states and review their activity history with TzufGuard.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://amitaibenshalom.com/">
    <title>TzufGuard · Know when a door changes</title>
    <link rel="canonical" href="https://amitaibenshalom.com/">
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    <script src="{{ url_for('static', filename='vendor/ably-pubsub-device-3.0.0.min.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='home.js') }}"></script>
</head>
<body class="marketing-page">
    {% include "_icons.html" %}

    <div class="hero-shell">
        <header class="site-header page-width">
            <a class="brand brand--light" href="/" aria-label="TzufGuard home"><svg><use href="#icon-logo"/></svg><span>TzufGuard</span></a>
            <nav class="site-nav" aria-label="Primary navigation">
                <a id="home-login-link" href="/login">Log in</a>
                <a id="home-nav-cta" class="button button--mint button--small" href="/register">Create account</a>
            </nav>
        </header>

        <section class="hero page-width" aria-labelledby="hero-title">
            <div class="hero-copy">
                <p class="eyebrow eyebrow--mint">Calm, connected, aware</p>
                <h1 id="hero-title">Know the moment a door changes.</h1>
                <div class="hero-actions">
                    <a id="home-primary-cta" class="button button--mint" href="/register">Create account <svg><use href="#icon-arrow"/></svg></a>
                    <a id="home-secondary-login" class="button button--ghost-light" href="/login">Log in</a>
                </div>
            </div>

            <aside id="public-demo" class="live-demo is-loading" aria-label="Live door sensor demonstration" aria-live="polite">
                <div class="live-demo__top"><span>Live from TzufGuard</span><span class="live-demo__signal"><i></i>Real sensor</span></div>
                <div class="live-demo__body">
                    <div class="live-demo__door" aria-hidden="true"><svg><use href="#icon-logo"/></svg></div>
                    <div class="live-demo__copy">
                        <p id="demo-door-label">Amitai's door</p>
                        <strong id="demo-door-status">Connecting…</strong>
                        <span id="demo-door-detail">Reading the current door status</span>
                    </div>
                </div>
            </aside>
        </section>
    </div>
</body>
</html>
