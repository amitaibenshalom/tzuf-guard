name: Device health sweep

on:
  schedule:
    # Offset from the top of the hour to reduce peak-time scheduling delays.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: device-health-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Mark stale sensors offline
        env:
          DEVICE_HEALTH_CRON_SECRET: ${{ secrets.DEVICE_HEALTH_CRON_SECRET }}
        run: |
          if [ -z "$DEVICE_HEALTH_CRON_SECRET" ]; then
            echo "::warning::DEVICE_HEALTH_CRON_SECRET is not configured; skipping sweep."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 30 \
            -H "Authorization: Bearer $DEVICE_HEALTH_CRON_SECRET" \
            https://amitaibenshalom.com/api/internal/device-health
